name: easy_ncc
description: Easy NCC - BNCC activity, cadet and training management platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.5.0
  supabase_flutter: ^2.18.3
  google_fonts: ^8.2.1
  intl: ^0.20.2
  pdf: ^3.13.1
  printing: ^5.15.1
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  cross_file: ^0.3.5+5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/bncc_logo.png
